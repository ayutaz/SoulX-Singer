[project]
name = "soulxsinger"
version = "0.1.0"
description = "High-Quality Zero-Shot Singing Voice Synthesis"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.11.0",
    "gradio==6.3.0",
    "librosa==0.11.0",
    "numpy==2.2.6",
    "omegaconf==2.3.0",
    "scipy==1.15.3",
    "soundfile==0.13.1",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
    "tqdm==4.67.1",
    "transformers==4.41.2",
]

[project.optional-dependencies]
preprocess = [
    "beartype==0.22.9",
    "einops==0.8.2",
    "funasr==1.3.0",
    "g2p_en==2.1.0",
    "g2pM==0.1.2.5",
    "loralib==0.1.2",
    "matplotlib==3.10.8",
    "mido==1.3.3",
    "ml_collections==1.1.0",
    "nemo_toolkit==2.6.1",
    "nltk==3.9.2",
    "numba==0.63.1",
    "packaging==24.2",
    "praat-parselmouth==0.4.7",
    "pretty_midi==0.2.11",
    "pyloudnorm==0.2.0",
    "pyworld==0.3.5",
    "rotary_embedding_torch==0.8.9",
    "sageattention==1.0.6",
    "scikit_learn==1.7.2",
    "scikit_image==0.25.2",
    "six==1.17.0",
    "ToJyutping==3.2.0",
    "wandb==0.24.2",
    "webrtcvad-wheels>=2.0.14",
    "lightning>=2.6.1",
    "fiddle>=0.3.0",
    "cloudpickle>=3.1.2",
    "lhotse>=1.31.1",
    "braceexpand>=0.1.7",
    "jiwer>=3.1.0,<4.0.0",
    "marshmallow>=4.2.2",
    "optuna>=4.7.0",
    "pyannote-core>=6.0.1",
    "pyannote-metrics>=4.0.0",
    "resampy>=0.4.3",
    "kaldialign<=0.9.1",
    "whisper-normalizer>=0.1.12",
    "datasets>=4.5.0",
    "mediapy==1.1.6",
    "sacremoses>=0.0.43",
    "peft>=0.18.1",
    "webdataset>=0.2.86",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
